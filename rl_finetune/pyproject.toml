[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-rl-finetune"
version = "0.1.0"
description = "GRPO and LoRA fine-tuning experiments for the Spider Text-to-SQL pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "transformers==4.46.3",
  "datasets>=2.21.0,<4",
  "peft==0.14.0",
  "trl==0.14.0",
  "accelerate>=0.34.0,<2",
  "nltk==3.9.1",
  "sqlparse==0.5.3",
  "tqdm==4.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]

