[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-single-turn-smoke"
version = "0.5.1"
description = "Single-turn and planner-coder-verifier Text-to-SQL evaluation for Spider 1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
inference = [
  "transformers==4.46.3",
]
official-eval = [
  "nltk==3.9.1",
  "sqlparse==0.5.3",
  "tqdm==4.67.1",
]

[project.scripts]
spider-smoke = "text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
